[project]
name = "fjkit-demo"
version = "0.1.0"
description = "The fjkit demo — a task board with htmx swaps, and the kit's acceptance test"
requires-python = ">=3.13"

# `plotly` builds the charts page's figures; fjkit itself does not require it.
dependencies = [
    "fastapi[standard]>=0.141.1",
    "fjkit",
    "plotly>=6.9.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

# fjkit is resolved from the workspace, not PyPI.
[tool.uv.sources]
fjkit = { workspace = true }
