[project]
name = "fjkit-admin-demo"
version = "0.1.0"
description = "The fjkit-admin demo — two SQLAlchemy models, one AdminPlugin, and the app's own shell around it"
requires-python = ">=3.13"

dependencies = [
    "fastapi[standard]>=0.141.1",
    "fjkit",
    "fjkit-admin",
]

# Both resolve from the workspace, not PyPI.
[tool.uv.sources]
fjkit = { workspace = true }
fjkit-admin = { workspace = true }
