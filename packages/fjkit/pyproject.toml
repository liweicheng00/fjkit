[project]
name = "fjkit"
version = "0.1.0.dev0"
description = "Server-rendered UI kit for FastAPI — Jinja2 + Basecoat + htmx, no front-end build"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "liweicheng00" }]

# PEP 639: an SPDX expression, not a `License ::` classifier — the two cannot
# both be present, and the classifier form is deprecated. `LICENSE` is resolved
# against this directory, not the repo root, so the file is duplicated there;
# a build backend cannot reach above the package it is building.
license = "MIT"
license-files = ["LICENSE"]

# Discovery metadata. The name carries no search surface — "fjkit" is not a word
# anyone types — so every term someone would actually search for has to live
# here, in the description, or in the README's first paragraph. That is the
# deliberate trade: an opaque name paid for with explicit metadata.
keywords = [
    "fastapi",
    "jinja2",
    "htmx",
    "basecoat",
    "ui",
    "ui-components",
    "server-side-rendering",
    "server-rendered",
    "html",
    "templates",
    "forms",
    "tables",
    "dark-mode",
    "no-build",
]

# Every entry verified against `https://pypi.org/pypi?:action=list_classifiers`
# — an unlisted classifier is rejected at upload, not at build.
#
# `Framework :: FastAPI` is the load-bearing one: PyPI has a browse-by-classifier
# facet, so it is the only line here that puts fjkit on a page a stranger can
# arrive at without knowing the name. There is no `Framework :: Jinja2`
# classifier; jinja2 is covered by the keyword instead.
#
# `Typing :: Typed` is a claim backed by `src/fjkit/py.typed`. Python 3.14 is
# permitted by requires-python but not claimed here, because nothing tests it.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]

# Back to two. `pydantic` was the third from 0.3 (CHARTER.md §7, §11.2) and it
# left with `figures.py` when charts became `fjkit-charts` — that module was its
# only importer. The kit itself never imports pydantic and says so out loud:
# `rendering.py` duck-types rather than isinstance, and `errors.py` takes
# `RequestValidationError` from `fastapi.exceptions`.
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1.6",
]

# These become the sidebar links on the PyPI project page. Without them the page
# offers a visitor nowhere to go but the README.
[project.urls]
Homepage = "https://liweicheng00.github.io/fjkit/"
Documentation = "https://liweicheng00.github.io/fjkit/"
Repository = "https://github.com/liweicheng00/fjkit"
Issues = "https://github.com/liweicheng00/fjkit/issues"

[project.scripts]
fjkit = "fjkit.cli:main"

[dependency-groups]
# Only fjkit itself needs Tailwind — it runs at release time to produce
# static/dist/fjkit-<pack>.css, one per style pack. Consumers never install this.
build = ["pytailwindcss>=0.3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fjkit"]

[tool.hatch.build]
# Templates, the built stylesheet and the vendored assets ship inside the
# wheel — that is what makes "no build step" true for consumers.
artifacts = [
    "src/fjkit/templates/**/*",
    "src/fjkit/static/**/*",
]
