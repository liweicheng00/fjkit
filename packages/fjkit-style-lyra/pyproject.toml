# Marker package for the `lyra` style pack.
#
# It carries no CSS. Every pack is already built inside the fjkit wheel — this
# distribution exists only so that `uv add "fjkit[lyra]"` leaves something
# behind that fjkit can find at startup, because a Python extra can pull in
# another distribution and cannot change a byte of the one it belongs to.
#
# Deliberately no dependency on fjkit: fjkit's `lyra` extra depends on this,
# and the reverse edge would close the loop. Deliberately not version-locked to
# fjkit either — there is nothing in here to keep in step.
[project]
name = "fjkit-style-lyra"
version = "0.1.0"
description = "Selects the `lyra` style pack for fjkit"
requires-python = ">=3.13"
dependencies = []

# The whole payload. fjkit reads the *name* on this entry point and never
# imports the module.
[project.entry-points."fjkit.style"]
lyra = "fjkit_style_lyra"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fjkit_style_lyra"]
