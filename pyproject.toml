# Workspace root. It ships nothing itself: the package is `packages/fjkit`, and
# `examples/fjkit-demo` is the demo that doubles as the kit's acceptance test.
#
# Deliberately a virtual root (no [project] table). fjkit is the subject of this
# repository, so nothing at the top level should look like an installable app.

[tool.uv.workspace]
members = ["packages/*", "examples/*"]

# Declared once, workspace-wide: the demo resolves the three published packages
# to the local ones rather than to PyPI.
[tool.uv.sources]
fjkit = { workspace = true }
fjkit-charts = { workspace = true }
fjkit-apidocs = { workspace = true }

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
# Every package's suite and the demo's run together, so `uv run pytest` is the
# one command that covers everything.
testpaths = [
    "packages/fjkit/tests",
    "packages/fjkit-charts/tests",
    "packages/fjkit-apidocs/tests",
    "examples/fjkit-demo/tests",
]
# The demo's own package root, so its tests import `app.*` exactly as the demo
# does — no path juggling inside the test files.
pythonpath = ["examples/fjkit-demo"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
